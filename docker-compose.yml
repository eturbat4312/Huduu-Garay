# filename: docker-compose.yml
version: '3.9'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: huduu
      POSTGRES_USER: huduu_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # порт нээхгүй — зөвхөн internal network дотор
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
    volumes:
      - ./backend/media:/app/media
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8010}:8010"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/listings/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  push_worker:
    build:
      context: ./backend
    command: ["python", "manage.py", "process_push_notifications", "--watch", "--interval", "10"]
    env_file:
      - ./backend/.env
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - INTERNAL_API_URL=http://backend:8010/api
    env_file:
      - ./frontend/.env.local
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/mn').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
