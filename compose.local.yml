services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    command: ["bash", "-lc", "python manage.py migrate && python manage.py runserver 0.0.0.0:8010"]
    volumes:
      - ./backend:/app
    environment:
      PYTHONUNBUFFERED: "1"
      DEBUG: "True"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:19007,https://tanaid-honoy.mn,https://www.tanaid-honoy.mn"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: ["start-frontend-dev"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped

volumes:
  frontend_node_modules:
